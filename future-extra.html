<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来の私からのありがとう｜チャッピー＆サリー</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><h1>🌈 未来の私とお話しよう</h1><p>最後に、未来の私の気持ちをちょっと想像してみよう🤭</p></header><section class="question-box"><div class="other-box"><label for="wish">💎 願いが叶ったら、どんな気持ちになる？</label><p>「何がほしい？」の奥にある、本当に大切な気持ちを見つけよう。</p><textarea id="wish" placeholder="例：安心して、自由に過ごせてうれしい"></textarea></div><div class="other-box"><label for="thanks">🌷 未来の私が、今の私にありがとうを伝えるなら？</label><p>今の私が大切にしていること、未来の私が感謝していることは何かな？</p><textarea id="thanks" placeholder="例：自分の気持ちを大切にしてくれて、ありがとう"></textarea></div><p>思いつかなくても大丈夫😊</p></section><section class="navigation-section"><a href="step12.html" class="sub-button">← 前にもどる</a><button type="button" class="main-button" id="next">まとめへ進む 🌈</button></section></main></div><script>const key="mirai_future_extra";try{const d=JSON.parse(localStorage.getItem(key)||"{}");document.getElementById("wish").value=d.wish||"";document.getElementById("thanks").value=d.thanks||""}catch(e){}document.getElementById("next").onclick=()=>{localStorage.setItem(key,JSON.stringify({wish:document.getElementById("wish").value,thanks:document.getElementById("thanks").value}));location.href="summary.html"}</script></body></html>
