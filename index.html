      </header><section class="intro-section"><h2>今日はどちらにする？🤭</h2><p>気になるほうを選んでね。<br>どちらから始めても大丈夫💕</p></section><section class="cta-section"><h2 class="work-entry-heading">🌈 未来の私に会いに行くワーク</h2><p>今の私の本音と、これからの私。<br>2つのワークから選べるよ。</p><a href="work.html" class="main-button">🌈 ワークへ進む</a></section><section class="cta-section"><h2>💌 未来の私からの手紙</h2><p>1年後・5年後・10年後・15年後の私を想像して、<br>お手紙を受け取ろう。</p><a href="letter.html" class="main-button">💌 手紙の質問へ進む</a></section><section class="cta-section"><button type="button" id="clearMiraiData" class="sub-button">🧹 入力データを消す</button><p id="clearStatus" role="status"></p></section></main></div><script>document.getElementById("clearMiraiData").addEventListener("click",()=>{if(!confirm("ワークとお手紙の保存した回答をすべて消しますか？\n元に戻せません。"))return;for(let i=1;i<=13;i++)localStorage.removeItem("mirai_step"+i);localStorage.removeItem("mirai_letter");document.getElementById("clearStatus").textContent="入力データを消したよ😊"});</script></body></html>
