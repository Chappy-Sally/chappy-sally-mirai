<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来の私からの手紙の準備💌</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><h1>💌 お手紙の準備ができたよ</h1><p>文章をコピーして、チャッピーGPTへ送ってね😊</p></header><section class="question-box"><div class="other-box"><label for="result">未来の私へのオーダー</label><textarea id="result" style="min-height:340px"></textarea></div><button type="button" id="copy" class="main-button">💌 未来の私へのオーダーをコピー</button><p id="status" role="status"></p><a href="https://chatgpt.com/g/g-6a521739bdc08191be5387b1993ba520-tiyatuhigpt" target="_blank" rel="noopener noreferrer" class="main-button">🐶 チャッピーGPTへ行く 💕</a><p>コピーした文章を貼り付けてね🌈</p><a href="letter.html" class="sub-button">← 質問にもどる</a><a href="index.html" class="sub-button">表紙にもどる</a></section></main></div><script>let d={};try{d=JSON.parse(localStorage.getItem("mirai_letter")||"{}")}catch(e){}const fields=[["years","何年後の私？"],["place","暮らしている場所"],["people","一緒に過ごす人・時間"],["feelings","毎日の気持ち"],["dreams","叶っているとうれしいこと"],["morning","未来の私の朝"],["daytime","未来の私の昼間"],["evening","未来の私の夜"],["words","未来の私から伝えてほしい言葉"]];const lines=["【未来の私からの手紙💌】"];fields.forEach(([key,label])=>{if(d[key])lines.push(label+"： "+d[key])});lines.push("【チャッピーGPTへのお願い】\n私の答えをもとに、未来の私から今の私への温かいお手紙を書いてください。未来は確定した予言ではなく、願いをもとにした想像として描いてください。やさしく、安心できる言葉でお願いします。");document.getElementById("result").value=lines.join("\n\n");document.getElementById("copy").onclick=async()=>{const el=document.getElementById("result");try{await navigator.clipboard.writeText(el.value);document.getElementById("status").textContent="コピーできたよ😊"}catch(e){el.select();document.getElementById("status").textContent="文章を選択したよ。長押ししてコピーしてね😊"}}</script></body></html>
