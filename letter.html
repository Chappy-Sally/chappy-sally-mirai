<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来の私からの手紙💌｜チャッピー＆サリー</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><p class="mini-label">🐶 チャッピー＆サリーのやさしい未来ワーク</p><h1>💌 未来の私からの手紙</h1><p>未来の私を想像して、<br>今の私へやさしい手紙を届けよう🤭</p></header><section class="intro-section"><h2>お手紙の質問</h2><p>5年後・10年後・15年後。どの未来に会いに行きたい？ 正解はないよ。好きな未来を自由に描いてね🌈</p><p>ポチポチ選んで、思いつくところだけ書いてね😊</p></section><section class="question-box"><div class="choice-group"><h3>何年後の私からのお手紙がいい？</h3><div class="choice-list"><label class="choice-item"><input type="radio" name="years" value="5年後">5年後</label><label class="choice-item"><input type="radio" name="years" value="10年後">10年後</label><label class="choice-item"><input type="radio" name="years" value="15年後">15年後</label></div></div><div class="other-box"><label for="place">🏡 未来の私はどんな場所で暮らしている？</label><textarea id="place" placeholder="例：空が大きく見える家"></textarea></div><div class="other-box"><label for="people">💕 誰と、どんなふうに過ごしている？</label><textarea id="people" placeholder="例：大切な人とお茶を飲んでいる"></textarea></div><div class="other-box"><label for="feelings">🌈 どんな気持ちで毎日を過ごしている？</label><textarea id="feelings" placeholder="例：安心、自由、わくわく"></textarea></div><div class="other-box"><label for="dreams">✨ 叶っていたらうれしいことは？</label><textarea id="dreams" placeholder="小さなことでも大きな夢でもOK"></textarea></div><div class="other-box"><label for="morning">☀️ 未来の私の朝はどんなふう？</label><textarea id="morning" placeholder="例：ゆっくり起きて、窓から空を見る"></textarea></div><div class="other-box"><label for="daytime">🌷 昼間は何をして楽しんでいる？</label><textarea id="daytime" placeholder="例：好きなことをして過ごしている"></textarea></div><div class="other-box"><label for="evening">🌙 夜はどんな気持ちで眠りにつく？</label><textarea id="evening" placeholder="例：今日も楽しかったなぁ"></textarea></div><div class="other-box"><label for="words">💌 未来の私から今の私へ、<br>伝えてほしい言葉は？</label><textarea id="words" placeholder="例：大丈夫、楽しんでね"></textarea></div><p>空欄があっても大丈夫だよ🌿</p></section><section class="navigation-section"><a href="index.html" class="sub-button">← 表紙にもどる</a><button type="button" id="next" class="main-button">お手紙の準備へ 💌</button></section></main></div><script>const ids=["place","people","feelings","dreams","morning","daytime","evening","words"];try{const d=JSON.parse(localStorage.getItem("mirai_letter")||"{}");document.querySelectorAll('[name="years"]').forEach(x=>x.checked=x.value===d.years);ids.forEach(id=>document.getElementById(id).value=d[id]||"")}catch(e){}document.getElementById("next").onclick=()=>{const d={years:document.querySelector('[name="years"]:checked')?.value||""};ids.forEach(id=>d[id]=document.getElementById(id).value.trim());localStorage.setItem("mirai_letter",JSON.stringify(d));location.href="letter-summary.html"}</script></body></html>
