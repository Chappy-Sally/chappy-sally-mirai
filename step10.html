<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>STEP10｜未来の私に会いにいくナビ</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><p class="mirai-progress">STEP 10 / 13</p><h1>友だちは私をどう思っていると思う？</h1><p class="step-intro-note">自分が想像する印象と、本当はどんな私でいたいかを見つめます。</p><p>自分が想像する印象と本当の望みを見つめよう</p></header><section class="question-section"><div class="question-box"><p class="question-note">気になるものをポチポチ選んでね。複数でも、選ばなくてもOK🌿</p><div class="choice-list"><label class="choice-item"><input type="checkbox" name="choice" value="優しい人"><span>優しい人</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="面白い人"><span>面白い人</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="頼れる人"><span>頼れる人</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="一緒にいると安心する人"><span>一緒にいると安心する人</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="自分らしい人"><span>自分らしい人</span></label></div><div class="mirai-field"><label for="detail">人の目を気にしなくてよかったら、どんな私でいたい？</label><textarea id="detail" placeholder="ひとことでも、空欄でもOK😊"></textarea></div><p class="mirai-help">友だちの本当の気持ちを当てるものではなく、自分の想像を見つめる質問だよ。</p></div></section><section class="navigation-section"><a class="sub-button" href="step9.html">← ひとつ戻る</a><button class="main-button" type="button" id="next">次へ進む 🌈</button></section></main></div><script>const key="mirai_step10";try{const data=JSON.parse(localStorage.getItem(key)||"{}");document.querySelectorAll('input[name="choice"]').forEach(el=>{el.checked=(data.choices||[]).includes(el.value)});document.getElementById("detail").value=data.detail||""}catch(e){}document.getElementById("next").addEventListener("click",()=>{const choices=Array.from(document.querySelectorAll('input[name="choice"]:checked')).map(el=>el.value);const detail=document.getElementById("detail").value.trim();try{localStorage.setItem(key,JSON.stringify({choices,detail}))}catch(e){alert("保存できませんでした。端末の空き容量などをご確認ください。");return}location.href="step11.html"})</script></body></html>
