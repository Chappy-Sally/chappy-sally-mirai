<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEP12｜未来の私に会いにいくナビ</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><p>STEP 12 / 12</p><h1>これからどんな毎日を過ごしたい？</h1><p>気になるものを選んでね。空欄でも大丈夫😊</p></header><section class="question-box"><div class="choice-list"><label class="choice-item"><input type="checkbox" value="穏やか"><span>穏やか</span></label><label class="choice-item"><input type="checkbox" value="楽しい"><span>楽しい</span></label><label class="choice-item"><input type="checkbox" value="豊か"><span>豊か</span></label><label class="choice-item"><input type="checkbox" value="好きなことを楽しむ"><span>好きなことを楽しむ</span></label></div><div class="other-box"><label for="detail">ほかに思いつくことは？</label><textarea id="detail" placeholder="ひとことでもOK"></textarea></div><p>無理に答えなくていいよ🌿</p></section><section class="navigation-section"><a class="sub-button" href="step11.html">← 戻る</a><button class="main-button" id="next" type="button">次へ進む🌈</button></section></main></div><script>const key="mirai_step12";try{const d=JSON.parse(localStorage.getItem(key)||"{}");document.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=(d.choices||[]).includes(x.value));document.getElementById("detail").value=d.detail||""}catch(e){}document.getElementById("next").onclick=()=>{const choices=Array.from(document.querySelectorAll('input:checked')).map(x=>x.value);const detail=document.getElementById("detail").value;localStorage.setItem(key,JSON.stringify({choices,detail}));location.href="summary.html"}</script></body></html>
