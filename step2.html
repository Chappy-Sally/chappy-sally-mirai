<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>
    STEP2｜未来の私に会いにいくナビ
  </title>

  <meta
    name="description"
    content="未来の毎日を、ポチポチ選びながらやさしく思い浮かべるページです。"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <main class="content-card">

      <!-- ステップ表示 -->
      <section class="step-header">

        <p class="mini-label">
          🌈 STEP 2 / 10
        </p>

        <h1>
          そんな毎日になったら、<br>
          どんなふうに過ごしてる？
        </h1>

        <p class="hero-message">
          STEP1で選んだ気持ちで過ごせているとしたら、<br>
          どんな毎日になっているかな？😊
        </p>

      </section>


      <!-- 質問 -->
      <section class="question-section">

        <div class="question-box">

          <p class="question-lead">
            「これ、いいなぁ🤭」と思うものを
            ポチポチ選んでみてね。
          </p>

          <p class="question-note">
            複数選んでOKです🌿
          </p>


          <!-- 朝 -->
          <div class="choice-group">

            <h2 class="choice-group-title">
              ☀️ 朝はどんなふうに過ごしてる？
            </h2>

            <div class="choice-list">

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="morning"
                  value="ゆっくり起きている"
                >
                <span>ゆっくり起きている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="morning"
                  value="好きな時間に起きている"
                >
                <span>好きな時間に起きている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="morning"
                  value="朝日を浴びている"
                >
                <span>朝日を浴びている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="morning"
                  value="お茶やコーヒーを楽しんでいる"
                >
                <span>お茶やコーヒーを楽しんでいる</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="morning"
                  value="バタバタせずのんびりしている"
                >
                <span>バタバタせずのんびりしている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="morning"
                  value="それ以外"
                >
                <span>それ以外</span>
              </label>

            </div>

            <div class="other-box small-other-box">
              <label for="morningOther">
                ほかにあったら書いてね😊
              </label>

              <input
                type="text"
                id="morningOther"
                placeholder="例：朝から散歩している"
              >
            </div>

          </div>


          <!-- 誰と -->
          <div class="choice-group">

            <h2 class="choice-group-title">
              💕 誰と過ごしてる？
            </h2>

            <div class="choice-list">

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="withWho"
                  value="家族と過ごしている"
                >
                <span>家族と過ごしている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="withWho"
                  value="パートナーと過ごしている"
                >
                <span>パートナーと過ごしている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="withWho"
                  value="友人と楽しく過ごしている"
                >
                <span>友人と楽しく過ごしている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="withWho"
                  value="ペットと過ごしている"
                >
                <span>ペットと過ごしている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="withWho"
                  value="ひとり時間も楽しんでいる"
                >
                <span>ひとり時間も楽しんでいる</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="withWho"
                  value="それ以外"
                >
                <span>それ以外</span>
              </label>

            </div>

            <div class="other-box small-other-box">
              <label for="withWhoOther">
                ほかにあったら書いてね😊
              </label>

              <input
                type="text"
                id="withWhoOther"
                placeholder="例：仲間と一緒に過ごしている"
              >
            </div>

          </div>


          <!-- どこ -->
          <div class="choice-group">

            <h2 class="choice-group-title">
              🏡 どこで過ごしてる？
            </h2>

            <div class="choice-list">

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="place"
                  value="明るくて心地よい家"
                >
                <span>明るくて心地よい家</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="place"
                  value="自然を感じられる場所"
                >
                <span>自然を感じられる場所</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="place"
                  value="好きな街"
                >
                <span>好きな街</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="place"
                  value="空がよく見える場所"
                >
                <span>空がよく見える場所</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="place"
                  value="落ち着ける静かな場所"
                >
                <span>落ち着ける静かな場所</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="place"
                  value="それ以外"
                >
                <span>それ以外</span>
              </label>

            </div>

            <div class="other-box small-other-box">
              <label for="placeOther">
                ほかにあったら書いてね😊
              </label>

              <input
                type="text"
                id="placeOther"
                placeholder="例：海の近く、海外、富士山が見える場所 など"
              >
            </div>

          </div>


          <!-- 何をしている -->
          <div class="choice-group">

            <h2 class="choice-group-title">
              🌈 何をしてる？
            </h2>

            <div class="choice-list">

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="doing"
                  value="好きな仕事や活動をしている"
                >
                <span>好きな仕事や活動をしている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="doing"
                  value="好きなものを作っている"
                >
                <span>好きなものを作っている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="doing"
                  value="旅行やお出かけを楽しんでいる"
                >
                <span>旅行やお出かけを楽しんでいる</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="doing"
                  value="のんびり過ごしている"
                >
                <span>のんびり過ごしている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="doing"
                  value="人と楽しく話している"
                >
                <span>人と楽しく話している</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="doing"
                  value="新しいことを楽しんでいる"
                >
                <span>新しいことを楽しんでいる</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="doing"
                  value="自分のペースで過ごしている"
                >
                <span>自分のペースで過ごしている</span>
              </label>

              <label class="choice-item">
                <input
                  type="checkbox"
                  name="doing"
                  value="それ以外"
                >
                <span>それ以外</span>
              </label>

            </div>

            <div class="other-box small-other-box">
              <label for="doingOther">
                ほかにあったら書いてね😊
              </label>

              <input
                type="text"
                id="doingOther"
                placeholder="例：庭いじり、読書、習いごと など"
              >
            </div>

          </div>


          <!-- 最後の自由入力 -->
          <div class="other-box final-future-box">

            <label for="futureDay">
              ✨ こんな1日だったらいいなぁ😊
            </label>

            <textarea
              id="futureDay"
              rows="5"
              placeholder="浮かんだことがあったら、自由に書いてみてね"
            ></textarea>

          </div>

        </div>

      </section>


      <!-- 補足 -->
      <section class="note-section">

        <div class="note-box">

          <p>
            ぜんぶ決めなくて大丈夫🌿
          </p>

          <p>
            今はただ、
            <strong>
              「こんな毎日、いいなぁ🤭」
            </strong>
            を集めてみよう。
          </p>

        </div>

      </section>


      <!-- ボタン -->
      <section class="navigation-section">

        <a
          href="step1.html"
          class="sub-button"
        >
          ← STEP1にもどる
        </a>

        <button
          type="button"
          class="main-button"
          id="nextButton"
        >
          次へ進む 🌈
        </button>

      </section>


      <!-- フッター -->
      <section class="ending-section">

        <div class="ending-box">
          <p>
            「どうやって叶える？」はまだ考えなくてOK😊<br>
            まずは、好きな未来を見つけていこう🌈
          </p>
        </div>

      </section>

    </main>

  </div>


  <script>

    function getCheckedValues(name) {

      const checked =
        document.querySelectorAll(
          'input[name="' + name + '"]:checked'
        );

      return Array.from(checked).map(
        item => item.value
      );

    }


    const nextButton =
      document.getElementById("nextButton");


    nextButton.addEventListener(
      "click",
      function () {

        const step2Data = {

          morning:
            getCheckedValues("morning"),

          morningOther:
            document
              .getElementById("morningOther")
              .value
              .trim(),

          withWho:
            getCheckedValues("withWho"),

          withWhoOther:
            document
              .getElementById("withWhoOther")
              .value
              .trim(),

          place:
            getCheckedValues("place"),

          placeOther:
            document
              .getElementById("placeOther")
              .value
              .trim(),

          doing:
            getCheckedValues("doing"),

          doingOther:
            document
              .getElementById("doingOther")
              .value
              .trim(),

          futureDay:
            document
              .getElementById("futureDay")
              .value
              .trim()

        };


        localStorage.setItem(
          "mirai_step2",
          JSON.stringify(step2Data)
        );


        window.location.href =
          "step3.html";

      }
    );


    /* ===== 保存済み回答を復元 ===== */

    const savedData =
      localStorage.getItem(
        "mirai_step2"
      );


    if (savedData) {

      const data =
        JSON.parse(savedData);


      function restoreCheckboxes(
        name,
        values
      ) {

        if (!Array.isArray(values)) {
          return;
        }


        values.forEach(
          function (value) {

            const checkbox =
              document.querySelector(
                'input[name="' +
                name +
                '"][value="' +
                value +
                '"]'
              );


            if (checkbox) {
              checkbox.checked = true;
            }

          }
        );

      }


      restoreCheckboxes(
        "morning",
        data.morning
      );

      restoreCheckboxes(
        "withWho",
        data.withWho
      );

      restoreCheckboxes(
        "place",
        data.place
      );

      restoreCheckboxes(
        "doing",
        data.doing
      );


      document.getElementById(
        "morningOther"
      ).value =
        data.morningOther || "";


      document.getElementById(
        "withWhoOther"
      ).value =
        data.withWhoOther || "";


      document.getElementById(
        "placeOther"
      ).value =
        data.placeOther || "";


      document.getElementById(
        "doingOther"
      ).value =
        data.doingOther || "";


      document.getElementById(
        "futureDay"
      ).value =
        data.futureDay || "";

    }

  </script>

</body>
</html>
