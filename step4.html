<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>STEP4｜未来の私に会いに行くワーク</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><p class="mirai-progress">STEP 4 / 12</p><h1>こうなったらいいなぁ🤭</h1>
<p class="step-intro-note">叶えたいことを、 1個でも10個でも自由に書いてみます。</p><p>叶えたい未来を自由に描こう</p></header><section class="question-section"><div class="question-box"><p class="question-note">気になるものをポチポチ選んでね。複数でも、選ばなくてもOK🌿</p><div class="choice-list"><label class="choice-item"><input type="checkbox" name="choice" value="暮らし"><span>暮らし</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="家族・友だち"><span>家族・友だち</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="仕事・作品"><span>仕事・作品</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="旅・体験"><span>旅・体験</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="安心と豊かさ"><span>安心と豊かさ</span></label></div><div class="mirai-field"><label for="detail">叶えたいことを、1個でも10個でも</label><textarea id="detail" placeholder="ひとことでも、空欄でもOK😊"></textarea></div><p class="mirai-help">正解はないよ。今の気持ちを大切にしてね😊</p></div></section><section class="navigation-section"><a class="sub-button" href="step3.html">← ひとつ戻る</a><button class="main-button" type="button" id="next">次へ進む 🌈</button></section></main></div><script>const key="mirai_step4";try{const data=JSON.parse(localStorage.getItem(key)||"{}");document.querySelectorAll('input[name="choice"]').forEach(el=>{el.checked=(data.choices||[]).includes(el.value)});document.getElementById("detail").value=data.detail||""}catch(e){}document.getElementById("next").addEventListener("click",()=>{const choices=Array.from(document.querySelectorAll('input[name="choice"]:checked')).map(el=>el.value);const detail=document.getElementById("detail").value.trim();try{localStorage.setItem(key,JSON.stringify({choices,detail}))}catch(e){alert("保存できませんでした。端末の空き容量などをご確認ください。");return}location.href="step5.html"})</script></body></html>
