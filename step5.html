<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEP5｜未来の私に会いに行くワーク</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><p>STEP 5 / 12</p><h1>心配が少なくなったら？</h1>
<p class="step-intro-note">時間やお金の不安がやわらいだとき、 本当はどうしたいのかを見ていきます。</p><p>気になるものを選んでね。空欄でも大丈夫😊</p></header><section class="question-box"><div class="choice-list"><label class="choice-item"><input type="checkbox" value="好きなことを楽しむ"><span>好きなことを楽しむ</span></label><label class="choice-item"><input type="checkbox" value="のんびり休む"><span>のんびり休む</span></label><label class="choice-item"><input type="checkbox" value="旅に出る"><span>旅に出る</span></label><label class="choice-item"><input type="checkbox" value="大切な人と過ごす"><span>大切な人と過ごす</span></label></div><div class="other-box"><label for="detail">ほかに思いつくことは？</label><textarea id="detail" placeholder="ひとことでもOK"></textarea></div><p>無理に答えなくていいよ🌿</p></section><section class="navigation-section"><a class="sub-button" href="step4.html">← 戻る</a><button class="main-button" id="next" type="button">次へ進む🌈</button></section></main></div><script>const key="mirai_step5";try{const d=JSON.parse(localStorage.getItem(key)||"{}");document.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=(d.choices||[]).includes(x.value));document.getElementById("detail").value=d.detail||""}catch(e){}document.getElementById("next").onclick=()=>{const choices=Array.from(document.querySelectorAll('input:checked')).map(x=>x.value);const detail=document.getElementById("detail").value;localStorage.setItem(key,JSON.stringify({choices,detail}));location.href="step6.html"}</script></body></html>
