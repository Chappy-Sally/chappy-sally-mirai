<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEP6｜未来の私に会いにいくナビ</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><p>STEP 6 / 6</p><h1>どんな私でいたい？</h1><p class="step-intro-note">よく笑う私、安心している私、自分を大切にする私などを選びます。</p><p>気になるものを選んでね。空欄でも大丈夫😊</p></header><section class="question-box"><div class="choice-list"><label class="choice-item"><input type="checkbox" value="よく笑う私"><span>よく笑う私</span></label><label class="choice-item"><input type="checkbox" value="安心している私"><span>安心している私</span></label><label class="choice-item"><input type="checkbox" value="自由な私"><span>自由な私</span></label><label class="choice-item"><input type="checkbox" value="自分を大切にする私"><span>自分を大切にする私</span></label></div><div class="other-box"><label for="detail">ほかに思いつくことは？</label><textarea id="detail" placeholder="ひとことでもOK"></textarea></div><p>無理に答えなくていいよ🌿</p></section><section class="navigation-section"><a class="sub-button" href="step5.html">← 戻る</a><button class="main-button" id="next" type="button">次へ進む🌈</button></section></main></div><script>const key="mirai_step6";try{const d=JSON.parse(localStorage.getItem(key)||"{}");document.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=(d.choices||[]).includes(x.value));document.getElementById("detail").value=d.detail||""}catch(e){}document.getElementById("next").onclick=()=>{const choices=Array.from(document.querySelectorAll('input:checked')).map(x=>x.value);const detail=document.getElementById("detail").value;localStorage.setItem(key,JSON.stringify({choices,detail}));location.href="summary-now.html"}</script></body></html>
