<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>STEP9｜未来の私に会いにいくナビ</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><p class="mirai-progress">STEP 9 / 13</p><h1>もし今日が人生最後の日だったら？</h1><p>今日を大切にするための想像のワーク</p></header><section class="question-section"><div class="question-box"><p class="question-note">気になるものをポチポチ選んでね。複数でも、選ばなくてもOK🌿</p><div class="choice-list"><label class="choice-item"><input type="checkbox" name="choice" value="大好きな人と過ごす"><span>大好きな人と過ごす</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="ありがとうを伝える"><span>ありがとうを伝える</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="好きなものを食べる"><span>好きなものを食べる</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="空や景色を眺める"><span>空や景色を眺める</span></label>
<label class="choice-item"><input type="checkbox" name="choice" value="ゆっくり安心して過ごす"><span>ゆっくり安心して過ごす</span></label></div><div class="mirai-field"><label for="detail">今日できる小さなことは？</label><textarea id="detail" placeholder="ひとことでも、空欄でもOK😊"></textarea></div><p class="mirai-help">答えにくかったら飛ばして大丈夫。これは未来を決める質問ではありません。</p></div></section><section class="navigation-section"><a class="sub-button" href="step8.html">← ひとつ戻る</a><button class="main-button" type="button" id="next">次へ進む 🌈</button></section></main></div><script>const key="mirai_step9";try{const data=JSON.parse(localStorage.getItem(key)||"{}");document.querySelectorAll('input[name="choice"]').forEach(el=>{el.checked=(data.choices||[]).includes(el.value)});document.getElementById("detail").value=data.detail||""}catch(e){}document.getElementById("next").addEventListener("click",()=>{const choices=Array.from(document.querySelectorAll('input[name="choice"]:checked')).map(el=>el.value);const detail=document.getElementById("detail").value.trim();try{localStorage.setItem(key,JSON.stringify({choices,detail}))}catch(e){alert("保存できませんでした。端末の空き容量などをご確認ください。");return}location.href="step10.html"})</script></body></html>
