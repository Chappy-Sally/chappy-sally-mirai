<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今の私の本音のまとめ</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><h1>🌱 今の私の本音のまとめ</h1><p>答えをまとめてチャッピーGPTへ届けよう😊</p></header><section class="question-box"><div class="other-box"><label for="result">私の気づき</label><textarea id="result" style="min-height:340px"></textarea></div><button class="main-button" id="copy" type="button">まとめをコピー 📋</button><p id="status" role="status"></p><a class="main-button" href="https://chatgpt.com/g/g-6a521739bdc08191be5387b1993ba520-tiyatuhigpt" target="_blank" rel="noopener noreferrer">🐶 チャッピーGPTへ行く 💕</a><a class="sub-button" href="step6.html">← 質問にもどる</a><a class="sub-button" href="work.html">ワークを選ぶ</a></section></main></div><script>const names=["大切にしたい気持ち","未来の毎日","やってみたいこと","叶えたいこと","心配が少なくなったら","どんな私でいたい"];let lines=["【今の私の本音を見つけるワーク】"];for(let i=1;i<=6;i++){let d={};try{d=JSON.parse(localStorage.getItem("mirai_step"+i)||"{}")}catch(e){}let values=Object.values(d).filter(v=>Array.isArray(v)?v.length:typeof v==="string"&&v.trim()).map(v=>Array.isArray(v)?v.join("、"):v);if(values.length)lines.push(names[i-1]+"： "+values.join(" / "))}lines.push("【チャッピーGPTへのお願い】\n今の私の気持ちと本当の願いをやさしく整理してください。決めつけず、安心できる言葉でお願いします。");document.getElementById("result").value=lines.join("\n\n");document.getElementById("copy").onclick=async()=>{const e=document.getElementById("result");try{await navigator.clipboard.writeText(e.value);document.getElementById("status").textContent="コピーできたよ😊"}catch(err){e.select();document.getElementById("status").textContent="文章を選択したよ。長押しでコピーしてね😊"}}</script></body></html>
