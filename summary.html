<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来の私のまとめ｜チャッピー＆サリー</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><h1>未来の私のまとめ🌈</h1><p>これからの私について、見つけたことをまとめよう🌈</p></header><section class="question-box"><p>回答は保存されているよ😊 ほかのワークも答えたら、まとめてチャッピーGPTに送れるよ。</p><div class="other-box"><label for="result">あなたの未来ワーク</label><textarea id="result" style="min-height:340px"></textarea></div><button type="button" id="copy" class="main-button">このワークだけコピー 📋</button><p id="status" role="status"></p><a class="main-button" href="summary-all.html">🌈 2つのワークをまとめる</a><a class="sub-button" href="work.html">ほかのワークをやってみる</a><a href="https://chatgpt.com/g/g-6a521739bdc08191be5387b1993ba520-tiyatuhigpt" class="main-button" target="_blank" rel="noopener noreferrer">🐶 チャッピーGPTへ行く 💕</a><p>コピーした文章を、開いたチャッピーGPTに貼り付けてね😊</p><a href="future-extra.html" class="sub-button">← 前に戻る</a><a href="index.html" class="sub-button">表紙に戻る</a></section></main></div><script>const labels=["大切にしたい気持ち","未来の毎日","やってみたいこと","叶えたいこと","心配が少なくなったら","どんな私でいたい","残したいもの","残り1年なら","今日が最後なら","友だちからの印象","大切な言葉","これからの毎日"];let lines=["【これからの私を描くワーク】"];for(let i=7;i<=12;i++){let d={};try{d=JSON.parse(localStorage.getItem("mirai_step"+i)||"{}")}catch(e){}const values=Object.values(d).filter(v=>Array.isArray(v)?v.length:typeof v==="string"&&v.trim()).map(v=>Array.isArray(v)?v.join("、"):v);if(values.length)lines.push("STEP"+i+" "+labels[i-1]+"\n"+values.join("\n"))}try{const extra=JSON.parse(localStorage.getItem("mirai_future_extra")||"{}");if(extra.wish)lines.push("願いが叶ったらどんな気持ち？\n"+extra.wish);if(extra.thanks)lines.push("未来の私から今の私へのありがとう\n"+extra.thanks)}catch(e){}lines.push("【チャッピーGPTへのお願い】\n答えをやさしく整理して、私が大切にしたい気持ちやこれからの望みを見つけるお手伝いをしてください。決めつけず、今できる小さな一歩があればひとつ添えてください。");document.getElementById("result").value=lines.join("\n\n");document.getElementById("copy").onclick=async()=>{const el=document.getElementById("result");try{await navigator.clipboard.writeText(el.value);document.getElementById("status").textContent="コピーできたよ😊"}catch(e){el.select();document.getElementById("status").textContent="文章を選択したよ。長押ししてコピーしてね😊"}}</script></body></html>
