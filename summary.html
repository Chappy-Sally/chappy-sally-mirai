<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来の私のまとめ｜チャッピー＆サリー</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="content-card"><header class="step-header"><h1>未来の私のまとめ🌈</h1><p>ここまでの気づきを未来の私からのお手紙につなげよう💌</p></header><section class="question-box"><p>下の文章をコピーしてチャッピーGPTに送ってね😊</p><div class="other-box"><label for="result">あなたの未来ワーク</label><textarea id="result" style="min-height:340px"></textarea></div><button type="button" id="copy" class="main-button">まとめをコピー 📋</button><p id="status" role="status"></p><a href="step13.html" class="sub-button">← 前に戻る</a><a href="index.html" class="sub-button">表紙に戻る</a></section></main></div><script>const labels=["大切にしたい気持ち","未来の毎日","やってみたいこと","叶えたいこと","心配が少なくなったら","どんな私でいたい","残したいもの","残り1年なら","今日が最後なら","友だちからの印象","大切な言葉","これからの毎日","未来からのお手紙"];let lines=["【未来の私に会いにいくナビ】"];for(let i=1;i<=13;i++){let d={};try{d=JSON.parse(localStorage.getItem("mirai_step"+i)||"{}")}catch(e){}const values=Object.values(d).filter(v=>Array.isArray(v)?v.length:typeof v==="string"&&v.trim()).map(v=>Array.isArray(v)?v.join("、"):v);if(values.length)lines.push("STEP"+i+" "+labels[i-1]+"\n"+values.join("\n"))}lines.push("【チャッピーGPTへのお願い】\n答えをやさしく整理し、私の望みをもとに未来の私から今の私へ温かい手紙を書いてください。未来を確定した予言として扱わず、焦らせず、今できる小さな一歩をひとつ添えてください。");document.getElementById("result").value=lines.join("\n\n");document.getElementById("copy").onclick=async()=>{const el=document.getElementById("result");try{await navigator.clipboard.writeText(el.value);document.getElementById("status").textContent="コピーできたよ😊"}catch(e){el.select();document.getElementById("status").textContent="文章を選択したよ。長押ししてコピーしてね😊"}}</script></body></html>
